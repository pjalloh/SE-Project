<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Planalytics – Login</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,800;1,400&family=Italiana&family=Inter:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    /* Specific styles for the Login Page */
    
    html, body {
        height: 100%;
        display: flex;
        align-items: center; /* Vertical center */
        justify-content: center; /* Horizontal center */
        padding: 0;
    }
    .wrap {
        max-width: 450px; 
        width: 90%;
        margin: 0;
        padding: 24px;
    }

    /* Styling the Login Card to match the app's aesthetic */
    .login-card {
      background: var(--panel); 
      border: 1px solid #e8e0d0; 
      border-radius: 22px; 
      padding: 40px;
      box-shadow: 0 16px 40px var(--ring);
      text-align: center;
    }

    .login-title {
      font-family: 'Playfair Display', serif;
      font-weight: 800;
      font-size: 36px;
      margin-bottom: 8px;
      color: var(--ink);
    }
    
    .login-subtitle {
        color: var(--muted);
        margin-bottom: 30px;
        font-family: 'Cormorant Garamond', serif;
    }

    /* Form Styles */
    .login-form input[type="email"], 
    .login-form input[type="password"] {
      width: 100%;
      padding: 12px 18px;
      margin-bottom: 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      font-family: Inter, sans-serif;
      font-size: 16px;
      color: var(--ink);
    }
    
    .login-form button {
        display: block; 
        width: 100%;
        margin-top: 10px;
        color: var(--accent-ink);
        background: var(--accent);
        border: none; 
        padding: 12px 20px; 
        border-radius: 999px; 
        font-family: 'Cormorant Garamond', serif; 
        font-weight: 600; 
        font-size: 18px; 
        cursor: pointer;
        box-shadow: 0 3px 0 #eac077; 
        transition: transform .05s ease;
    }
    
    /* Specific styling for the Register button */
    #newUser {
        background: none;
        color: var(--ink);
        border: 1px solid var(--ink);
        box-shadow: none;
        margin-top: 10px;
    }

    .login-form button:active {
        transform: translateY(2px); 
        box-shadow: 0 1px 0 #eac077;
    }
    .login-form button:disabled {
        opacity: 0.7;
        cursor: not-allowed;
    }
    
    /* Error Message Styling */
    #error {
        color: #e53e3e; /* A standard error red */
        background: #fef2f2;
        border: 1px solid #fbd2d2;
        padding: 10px;
        border-radius: 8px;
        margin-top: 20px;
        font-family: Inter, sans-serif;
        font-size: 14px;
        text-align: left;
        min-height: 40px; /* Ensure space even when empty */
        display: flex;
        align-items: center;
    }

    /* The logo/brand text at the top */
    .login-brand {
        font-family: "Cormorant Garamond", serif; 
        font-weight: 600; 
        font-size: 32px; 
        letter-spacing:.2px;
        color: var(--ink);
        margin-bottom: 10px;
    }
    .login-brand .plane {
        color: var(--accent-ink); 
        font-family: Italiana, serif;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- Brand/Logo -->
    <div class="login-brand">Planalytics <span class="plane">✈︎</span></div>
    
    <main class="login-card" role="main">
        <h1 class="login-title">User Authentication</h1>
        <p class="login-subtitle">Sign in or register to access your personalized travel plans.</p>
        
        <form id="login-form" class="login-form">
            <!-- Email/Username -->
            <input type="email" id="username" placeholder="Email Address (Username)" required />
            <!-- Password -->
            <input type="password" id="password" placeholder="Password" required minlength="6"/>
            
            <button type="submit" id="loginButton">Log In</button>
            <button type="button" id="newUser">Register new user</button>
            
            <!-- Error Message Display -->
            <div id="error">&nbsp;</div>
        </form>

    </main>
    
    <!-- Link the client-side logic -->
    <script src="login.js"></script>
  </div>
</body>
</html>
